name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build, and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootcamp_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bootcamp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:55432/bootcamp_test
      REDIS_URL: redis://localhost:6379/0
      API_KEY_A: test-key-a
      API_KEY_B: test-key-b
      IMAGE_NAME: myservice
      IMAGE_SIZE_LIMIT_BYTES: "350000000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check . --select E9,F

      - name: Test
        run: python -m pytest

      - name: Scan workflow for hardcoded secret references
        shell: bash
        run: |
          if grep -RInE 'password|token|secret|api[_-]?key' .github/workflows | grep -viE 'secrets\.|test-key|POSTGRES_PASSWORD|secret references'; then
            echo "Potential hardcoded secret in workflow"
            exit 1
          fi

      - name: Build Docker image with commit SHA tag
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Check image size
        shell: bash
        run: |
          size="$(docker image inspect "$IMAGE_NAME:${{ github.sha }}" --format='{{.Size}}')"
          echo "Image size: ${size} bytes"
          if [ "$size" -gt "$IMAGE_SIZE_LIMIT_BYTES" ]; then
            echo "Image exceeds ${IMAGE_SIZE_LIMIT_BYTES} byte limit"
            exit 1
          fi

      - name: Scan image for local secrets and build artifacts
        shell: bash
        run: |
          matches="$(docker run --rm --entrypoint sh "$IMAGE_NAME:${{ github.sha }}" -c \
            "find /app -name '.env*' -o -name '*.db' -o -name '*.log' -o -path '*/tests/*' -o -path '*/.venv/*' -o -path '*/__pycache__/*' -o -name '*.pyc'")"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Image contains files that should not ship"
            exit 1
          fi

      - name: Start container
        run: |
          docker run -d --name myservice-ci \
            -p 8000:8000 \
            -e PORT="$PORT" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e API_KEY_A="$API_KEY_A" \
            -e API_KEY_B="$API_KEY_B" \
            "$IMAGE_NAME:${{ github.sha }}"

      - name: Verify health endpoints and non-root user
        shell: bash
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8000/live; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/ready
          test "$(docker exec myservice-ci whoami)" = "appuser"
          test "$(docker inspect --format '{{.State.Health.Status}}' myservice-ci)" = "healthy"

      - name: Save traceable image artifact
        run: |
          mkdir -p artifacts
          docker save "$IMAGE_NAME:${{ github.sha }}" -o "artifacts/$IMAGE_NAME-${{ github.sha }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: myservice-${{ github.sha }}
          path: artifacts/*.tar
          retention-days: 7

      - name: Clean up container
        if: always()
        run: docker rm -f myservice-ci || true
