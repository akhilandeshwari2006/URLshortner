steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install dependencies
    run: python -m pip install -r requirements-dev.txt

  - name: Run tests
    run: pytest

